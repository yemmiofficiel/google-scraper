name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1. Récupérer le projet
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Installer Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Installer Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Installer les dépendances système
      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev \
            automake \
            autopoint \
            gettext

      # 5. Mettre pip à jour
      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip setuptools wheel

      # 6. Installer Buildozer + Cython
      - name: Install Buildozer
        run: |
          python -m pip install \
            "buildozer==1.5.0" \
            "cython==0.29.33" \
            "virtualenv"

      # 7. Vérifier les versions
      - name: Check build environment
        run: |
          python --version
          python -m pip --version
          buildozer --version
          cython --version

      # 8. Nettoyer complètement l'ancien environnement Buildozer
      - name: Clean Buildozer environment
        run: |
          rm -rf .buildozer
          rm -rf bin

      # 9. Accepter automatiquement les licences Android
      - name: Configure Android licenses
        run: |
          sed -i 's/^# *android.accept_sdk_license = False/android.accept_sdk_license = True/' buildozer.spec || true

      # 10. Construire l'APK
      - name: Build APK
        run: |
          buildozer android debug

      # 11. Vérifier que l'APK existe
      - name: Check APK
        run: |
          echo "APK générés :"
          ls -lh bin/*.apk

      # 12. Télécharger l'APK comme artifact GitHub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if-no-files-found: error
